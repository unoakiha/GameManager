<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ゲーム管理帳</title><meta name="description" content="手持ちのゲームを記録・検索する個人用管理帳"><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f3f5fc;background:#101a32}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{padding:24px max(20px,calc((100vw - 1180px)/2));background:#14213e;border-bottom:1px solid #354564}h1{margin:0;font-size:1.65rem}.sub{color:#aebbd1;margin:5px 0 0}main{max-width:1180px;margin:auto;padding:24px 20px 100px}.toolbar,.filters,.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.toolbar{justify-content:space-between;margin-bottom:18px}.filters{background:#1d2a49;border:1px solid #3a4a69;padding:16px;border-radius:18px;margin-bottom:16px}.filters input,.filters select{flex:1 1 150px}input,select,textarea{background:#283754;color:white;border:1px solid #546481;border-radius:10px;padding:11px;min-width:0}input::placeholder{color:#b1bed0}button,.filebutton{border:1px solid #60708d;background:#2b3a59;color:white;border-radius:10px;padding:10px 14px;display:inline-block}.primary{background:#a82a5d;border-color:#c54878;font-weight:700}.danger{color:#ffb8c4}.small{font-size:.85rem;padding:7px 10px}.count{color:#b4c3d8;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:16px}.card{background:#1f2a45;border:1px solid #435371;border-radius:18px;overflow:hidden}.cover{height:180px;background:linear-gradient(135deg,#314365,#18243d);display:flex;align-items:center;justify-content:center;color:#a9b8d0;font-size:3rem}.cover img{width:100%;height:100%;object-fit:contain}.cardbody{padding:14px}.card h2{font-size:1.05rem;margin:0 0 9px;line-height:1.35;min-height:2.7em}.meta{font-size:.86rem;color:#c8d3e5;margin:5px 0}.badges{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}.badge{font-size:.77rem;background:#34486b;border-radius:99px;padding:4px 8px}.card .actions{margin-top:12px}.empty{padding:35px;text-align:center;color:#b5c2d8;border:1px dashed #667694;border-radius:18px}dialog{color:white;background:#1c2945;border:1px solid #63718c;border-radius:18px;width:min(720px,calc(100% - 20px));max-height:90vh;padding:0}dialog::backdrop{background:#070f20c9}.modal{padding:20px;overflow:auto;max-height:90vh}.modalhead{display:flex;justify-content:space-between;align-items:center}.modal h2{margin:0 0 14px}.section{border-top:1px solid #4b5b78;margin-top:20px;padding-top:16px}.section h3{margin:0 0 12px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.fields label{display:grid;gap:6px;color:#d9e1ef;font-size:.88rem}.fields .wide{grid-column:1/-1}.fields textarea{min-height:70px}.checks{display:flex;gap:14px;flex-wrap:wrap;margin:12px 0}.checks label{display:flex;align-items:center;gap:5px}.checks input{width:auto}.hint{color:#aabbd2;font-size:.83rem;line-height:1.5}.modalfoot{position:sticky;bottom:-20px;background:#1c2945;padding:16px 0 2px;display:flex;justify-content:flex-end;gap:10px}.preview{max-height:120px;max-width:150px;object-fit:contain}.notice{min-height:1.3em;color:#ffd3a9}a{color:#b7d1ff}@media(max-width:520px){.fields{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.cover{height:135px}.cardbody{padding:10px}.toolbar{align-items:stretch}.toolbar button{flex:1}.filters input:first-child{flex-basis:100%}}
</style></head><body><header><h1>🎮 ゲーム管理帳</h1><p class="sub">コレクションを、自分の手で記録する。</p></header><main><div class="toolbar"><strong id="summary">0 本</strong><div class="actions"><button id="exportBtn">JSONを書き出す</button><button id="importBtn">JSONを読み込む</button><input hidden type="file" id="importFile" accept="application/json,.json"><button class="primary" id="addBtn">＋ ゲームを登録</button></div></div><div class="filters"><input id="search" aria-label="検索" placeholder="タイトル・メーカー・タグ・メモを検索"><select id="platformFilter" aria-label="機種"><option value="">すべての機種</option></select><select id="ownedFilter" aria-label="所持"><option value="">所持状態すべて</option><option value="owned">所持</option><option value="wanted">欲しい</option><option value="former">手放した</option></select><select id="playFilter" aria-label="プレイ状況"><option value="">プレイ状況すべて</option><option value="unplayed">未プレイ</option><option value="playing">プレイ中</option><option value="cleared">クリア済み</option></select><select id="sort" aria-label="並び順"><option value="createdDesc">登録日・新しい順</option><option value="titleAsc">タイトル順</option><option value="releaseDesc">発売日・新しい順</option><option value="releaseAsc">発売日・古い順</option><option value="retailDesc">定価・高い順</option><option value="purchaseDesc">購入価格・高い順</option></select></div><div id="count" class="count"></div><div id="grid" class="grid"></div></main>
<dialog id="editor"><form id="form" class="modal"><div class="modalhead"><h2 id="dialogTitle">ゲームを登録</h2><button type="button" id="closeBtn" aria-label="閉じる">×</button></div><p class="hint">JANを入力すると駿河屋で検索できます。商品情報はページを見て手入力してください。</p><div class="section"><h3>商品情報</h3><div class="fields"><label class="wide">JAN<input name="jan" id="jan" inputmode="numeric" pattern="[0-9]*" placeholder="例：4995857080267"></label><div class="wide actions"><button type="button" id="scanBtn">📷 バーコードを読む</button><button type="button" id="photoBarcodeBtn">バーコードを撮影して確認</button><input hidden type="file" id="barcodePhoto" accept="image/*" capture="environment"><button type="button" id="surugayaBtn">駿河屋でJAN検索 ↗</button></div><p id="scanStatus" class="hint wide" aria-live="polite"></p><video id="camera" class="wide" playsinline muted hidden style="width:100%;max-height:260px"></video><img id="barcodePreview" class="wide" alt="撮影したバーコード。下のJAN欄に数字を入力してください" hidden style="width:100%;max-height:260px;object-fit:contain"><button type="button" id="stopScan" hidden>カメラを閉じる</button><label class="wide">タイトル *<input name="title" required placeholder="お掃除戦隊くりーんきーぱー [通常版]"></label><label>機種<input name="platform" list="platforms" placeholder="Wii"><datalist id="platforms"><option value="Wii"><option value="DS"><option value="3DS"><option value="GBA"><option value="Switch"><option value="PS2"><option value="PSP"></datalist></label><label>メーカー・販売元<input name="publisher"></label><label>発売日<input name="releaseDate" type="date"></label><label>定価（円）<input name="retailPrice" type="number" min="0"></label><label>品番<input name="model"></label><label>ジャンル<input name="genre"></label><label>CERO<input name="cero" placeholder="A / B / C など"></label><label>プレイ人数<input name="players" placeholder="1〜2人"></label><label class="wide">画像URL<input name="imageUrl" type="url" placeholder="https://..."></label><label class="wide">画像ファイル（端末内に保存）<input id="imageFile" type="file" accept="image/*"></label><img id="imagePreview" class="preview" hidden alt="画像プレビュー"></div></div><div class="section"><h3>自分の記録</h3><div class="fields"><label>所持状態<select name="ownership"><option value="owned">所持</option><option value="wanted">欲しい</option><option value="former">手放した</option></select></label><label>プレイ状況<select name="playStatus"><option value="unplayed">未プレイ</option><option value="playing">プレイ中</option><option value="cleared">クリア済み</option></select></label><label>購入価格（円）<input name="purchasePrice" type="number" min="0"></label><label>購入場所<input name="purchasePlace"></label><label>購入日<input name="purchaseDate" type="date"></label><label>タグ（カンマ区切り）<input name="tags" placeholder="ポケモン, レトロ"></label><label class="wide">メモ<textarea name="memo"></textarea></label></div><div class="checks"><label><input type="checkbox" name="box">箱あり</label><label><input type="checkbox" name="manual">説明書あり</label><label><input type="checkbox" name="favorite">お気に入り</label></div></div><p id="notice" class="notice" role="status"></p><div class="modalfoot"><button type="button" id="cancelBtn">キャンセル</button><button class="primary" type="submit">保存する</button></div></form></dialog><script>
'use strict';const KEY='game-collection-v1';const $=s=>document.querySelector(s);let games=[],editing=null,imageData='',stream=null,scanTimer=null,barcodePhotoUrl=null;const fields=['jan','title','platform','publisher','releaseDate','retailPrice','model','genre','cero','players','imageUrl','ownership','playStatus','purchasePrice','purchasePlace','purchaseDate','tags','memo'];const yen=n=>n!==''&&n!=null?Number(n).toLocaleString('ja-JP')+'円':'';const labelOwnership={owned:'所持',wanted:'欲しい',former:'手放した'},labelPlay={unplayed:'未プレイ',playing:'プレイ中',cleared:'クリア済み'};function load(){try{const data=JSON.parse(localStorage.getItem(KEY)||'[]');games=Array.isArray(data)?data:[]}catch{games=[]}}function save(){localStorage.setItem(KEY,JSON.stringify(games))}function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n}function render(){const platforms=[...new Set(games.map(g=>g.platform).filter(Boolean))].sort();const pf=$('#platformFilter'),current=pf.value;pf.replaceChildren(new Option('すべての機種',''),...platforms.map(p=>new Option(p,p)));pf.value=platforms.includes(current)?current:'';let list=games.filter(g=>{const q=$('#search').value.trim().toLocaleLowerCase();return (!q||[g.title,g.platform,g.publisher,g.genre,g.model,g.jan,g.tags,g.memo].join(' ').toLocaleLowerCase().includes(q))&&(!pf.value||g.platform===pf.value)&&(!$('#ownedFilter').value||g.ownership===$('#ownedFilter').value)&&(!$('#playFilter').value||g.playStatus===$('#playFilter').value)});const sort=$('#sort').value;list.sort((a,b)=>sort==='titleAsc'?a.title.localeCompare(b.title,'ja'):sort==='releaseDesc'?(b.releaseDate||'').localeCompare(a.releaseDate||''):sort==='releaseAsc'?(a.releaseDate||'').localeCompare(b.releaseDate||''):sort==='retailDesc'?Number(b.retailPrice||0)-Number(a.retailPrice||0):sort==='purchaseDesc'?Number(b.purchasePrice||0)-Number(a.purchasePrice||0):(b.createdAt||'').localeCompare(a.createdAt||''));$('#summary').textContent=games.length+' 本';$('#count').textContent=list.length+' 件を表示';const grid=$('#grid');grid.replaceChildren();if(!list.length){grid.append(el('div','empty',games.length?'条件に合うゲームがありません。':'まだゲームがありません。「＋ ゲームを登録」から始めましょう。'));return}for(const g of list){const card=el('article','card'),cover=el('div','cover');if(g.imageData||g.imageUrl){const img=el('img');img.alt='';img.src=g.imageData||g.imageUrl;img.onerror=()=>cover.replaceChildren(document.createTextNode('🎮'));cover.append(img)}else cover.textContent='🎮';card.append(cover);const body=el('div','cardbody');body.append(el('h2','',g.title));body.append(el('p','meta',[g.platform,g.releaseDate].filter(Boolean).join(' · ')||'機種・発売日 未入力'));if(g.publisher)body.append(el('p','meta',g.publisher));if(g.retailPrice!=='')body.append(el('p','meta','定価 '+yen(g.retailPrice)));const badges=el('div','badges');for(const value of [labelOwnership[g.ownership],labelPlay[g.playStatus],...(g.tags||'').split(',').map(s=>s.trim()).filter(Boolean)])badges.append(el('span','badge',value));body.append(badges);const actions=el('div','actions'),edit=el('button','small','編集'),del=el('button','small danger','削除');edit.onclick=()=>openEditor(g);del.onclick=()=>{if(confirm('「'+g.title+'」を削除しますか？')){games=games.filter(x=>x.id!==g.id);try{save();render()}catch{alert('保存に失敗しました')}}};actions.append(edit,del);body.append(actions);card.append(body);grid.append(card)}}function openEditor(g=null){stopScan();clearBarcodePhoto();editing=g?.id||null;$('#form').reset();$('#notice').textContent='';$('#scanStatus').textContent='';$('#dialogTitle').textContent=g?'ゲームを編集':'ゲームを登録';imageData=g?.imageData||'';for(const name of fields)if(g&&g[name]!=null)$('#form').elements[name].value=g[name];for(const name of ['box','manual','favorite'])$('#form').elements[name].checked=!!g?.[name];preview();$('#editor').showModal()}function preview(){const img=$('#imagePreview');img.src=imageData||$('#form').elements.imageUrl.value||'';img.hidden=!img.src}function clearBarcodePhoto(){if(barcodePhotoUrl)URL.revokeObjectURL(barcodePhotoUrl);barcodePhotoUrl=null;$('#barcodePreview').hidden=true;$('#barcodePreview').removeAttribute('src')}function stopScan(){if(scanTimer)clearInterval(scanTimer);scanTimer=null;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('#camera').hidden=true;$('#stopScan').hidden=true}async function scan(){if(!('BarcodeDetector' in window)){ $('#scanStatus').textContent='このブラウザでは自動読み取りに対応していません。「バーコードを撮影して確認」から数字を見て入力できます。';return}try{const detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a']});stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const video=$('#camera');video.srcObject=stream;video.hidden=false;$('#stopScan').hidden=false;await video.play();$('#scanStatus').textContent='バーコードをカメラに映してください。';let busy=false;scanTimer=setInterval(async()=>{if(busy)return;busy=true;try{const codes=await detector.detect(video);if(codes.length){$('#jan').value=codes[0].rawValue;$('#scanStatus').textContent='JANを読み取りました。';stopScan()}}catch{}finally{busy=false}},250)}catch(e){stopScan();$('#scanStatus').textContent='カメラを使えませんでした。HTTPS上で開いて権限を許可するか、JANを手入力してください。'}}$('#form').onsubmit=e=>{e.preventDefault();const f=e.currentTarget,g={id:editing||(typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'game-'+Date.now()+'-'+Math.random().toString(36).slice(2)),createdAt:editing?(games.find(x=>x.id===editing)?.createdAt||new Date().toISOString()):new Date().toISOString()};for(const name of fields)g[name]=f.elements[name].value.trim();for(const name of ['box','manual','favorite'])g[name]=f.elements[name].checked;g.imageData=imageData;if(g.jan&&!/^\d{8}$|^\d{13}$/.test(g.jan)){ $('#notice').textContent='JANは8桁または13桁の数字で入力してください。';return}const previous=[...games];games=editing?games.map(x=>x.id===editing?g:x):[g,...games];try{save();stopScan();clearBarcodePhoto();$('#editor').close();render()}catch{games=previous;$('#notice').textContent='保存容量が足りません。画像を小さくするか、JSONをバックアップしてください。'}};$('#imageFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const url=URL.createObjectURL(file),img=new Image();try{await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});const canvas=document.createElement('canvas'),scale=Math.min(1,700/Math.max(img.naturalWidth,img.naturalHeight));canvas.width=Math.round(img.naturalWidth*scale);canvas.height=Math.round(img.naturalHeight*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);imageData=canvas.toDataURL('image/jpeg',.72);preview()}finally{URL.revokeObjectURL(url)}}catch{$('#notice').textContent='画像を読み込めませんでした。'}};$('#form').elements.imageUrl.oninput=preview;$('#addBtn').onclick=()=>openEditor();$('#closeBtn').onclick=$('#cancelBtn').onclick=()=>{stopScan();clearBarcodePhoto();$('#editor').close()};$('#editor').addEventListener('close',()=>{stopScan();clearBarcodePhoto()});$('#scanBtn').onclick=scan;$('#photoBarcodeBtn').onclick=()=>$('#barcodePhoto').click();$('#barcodePhoto').onchange=e=>{const file=e.target.files[0];clearBarcodePhoto();if(file){barcodePhotoUrl=URL.createObjectURL(file);$('#barcodePreview').src=barcodePhotoUrl;$('#barcodePreview').hidden=false;$('#scanStatus').textContent='写真の数字を確認して、JAN欄に入力してください。'}e.target.value=''};$('#stopScan').onclick=stopScan;$('#surugayaBtn').onclick=()=>{const jan=$('#jan').value.trim();if(!/^\d{8}$|^\d{13}$/.test(jan)){ $('#scanStatus').textContent='先に8桁または13桁のJANを入力してください。';return}window.open('https://www.suruga-ya.jp/search?search_word='+encodeURIComponent(jan),'_blank','noopener,noreferrer')};for(const id of ['search','platformFilter','ownedFilter','playFilter','sort'])$('#'+id).addEventListener(id==='search'?'input':'change',render);$('#exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({format:'game-collection-v1',games},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='game-collection-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)};$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const raw=JSON.parse(await file.text());if(raw.format!=='game-collection-v1'||!Array.isArray(raw.games)||!raw.games.every(g=>g&&typeof g.id==='string'&&typeof g.title==='string'))throw Error('形式が違います');if(!confirm('現在の記録を、このバックアップの '+raw.games.length+' 件で置き換えますか？'))return;const old=games;games=raw.games;try{save();render()}catch{games=old;throw Error('保存容量が足りません')}}catch(err){alert('読み込みに失敗しました：'+err.message)}finally{e.target.value=''}};load();render();
</script></body></html>

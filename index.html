<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ゲーム管理帳</title><meta name="description" content="手持ちのゲームを記録・検索する個人用管理帳"><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f3f5fc;background:#101a32}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{padding:24px max(20px,calc((100vw - 1180px)/2));background:#14213e;border-bottom:1px solid #354564}h1{margin:0;font-size:1.65rem}.sub{color:#aebbd1;margin:5px 0 0}main{max-width:1180px;margin:auto;padding:24px 20px 100px}.toolbar,.filters,.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.toolbar{justify-content:space-between;margin-bottom:18px}.filters{background:#1d2a49;border:1px solid #3a4a69;padding:16px;border-radius:18px;margin-bottom:16px}.filters input,.filters select{flex:1 1 150px}input,select,textarea{background:#283754;color:white;border:1px solid #546481;border-radius:10px;padding:11px;min-width:0}input::placeholder{color:#b1bed0}button,.filebutton{border:1px solid #60708d;background:#2b3a59;color:white;border-radius:10px;padding:10px 14px;display:inline-block}.primary{background:#a82a5d;border-color:#c54878;font-weight:700}.danger{color:#ffb8c4}.small{font-size:.85rem;padding:7px 10px}.count{color:#b4c3d8;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:16px}.card{background:#1f2a45;border:1px solid #435371;border-radius:18px;overflow:hidden}.cover{height:180px;background:linear-gradient(135deg,#314365,#18243d);display:flex;align-items:center;justify-content:center;color:#a9b8d0;font-size:3rem}.cover img{width:100%;height:100%;object-fit:contain}.cardbody{padding:14px}.card h2{font-size:1.05rem;margin:0 0 9px;line-height:1.35;min-height:2.7em}.meta{font-size:.86rem;color:#c8d3e5;margin:5px 0}.badges{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}.badge{font-size:.77rem;background:#34486b;border-radius:99px;padding:4px 8px}.card .actions{margin-top:12px}.empty{padding:35px;text-align:center;color:#b5c2d8;border:1px dashed #667694;border-radius:18px}dialog{color:white;background:#1c2945;border:1px solid #63718c;border-radius:18px;width:min(720px,calc(100% - 20px));max-height:90vh;padding:0}dialog::backdrop{background:#070f20c9}.modal{padding:20px;overflow:auto;max-height:90vh}.modalhead{display:flex;justify-content:space-between;align-items:center}.modal h2{margin:0 0 14px}.section{border-top:1px solid #4b5b78;margin-top:20px;padding-top:16px}.section h3{margin:0 0 12px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.fields label{display:grid;gap:6px;color:#d9e1ef;font-size:.88rem}.fields .wide{grid-column:1/-1}.fields textarea{min-height:70px}.checks{display:flex;gap:14px;flex-wrap:wrap;margin:12px 0}.checks label{display:flex;align-items:center;gap:5px}.checks input{width:auto}.hint{color:#aabbd2;font-size:.83rem;line-height:1.5}.modalfoot{position:sticky;bottom:-20px;background:#1c2945;padding:16px 0 2px;display:flex;justify-content:flex-end;gap:10px}.preview{max-height:120px;max-width:150px;object-fit:contain}.notice{min-height:1.3em;color:#ffd3a9}a{color:#b7d1ff}@media(max-width:520px){.fields{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.cover{height:135px}.cardbody{padding:10px}.toolbar{align-items:stretch}.toolbar button{flex:1}.filters input:first-child{flex-basis:100%}}
.grid[data-view="two"]{grid-template-columns:repeat(2,minmax(0,1fr))}.grid[data-view="three"]{grid-template-columns:repeat(3,minmax(0,1fr))}.grid[data-view="list"]{display:flex;flex-direction:column;gap:6px}.grid[data-view="list"] .card{padding:0}.grid[data-view="list"] .cover,.grid[data-view="list"] .meta,.grid[data-view="list"] .badges{display:none}.grid[data-view="list"] .cardbody{padding:7px 12px}.grid[data-view="list"] .card h2{min-height:0;margin:0;font-size:1rem}.cardOpen{display:block;width:100%;text-align:left;border:0;background:none;padding:0}.cardOpen:hover h2{text-decoration:underline}.chipset{display:flex;flex-wrap:wrap;gap:7px}.chip{border-radius:99px;font-size:.85rem;padding:7px 11px}.chip[aria-pressed="true"]{background:#a82a5d;border-color:#d76a94}.rangeRow{display:grid;grid-template-columns:1fr 1fr;gap:12px}.rangeRow label{display:grid;gap:5px}.rangeRow input{width:100%;padding:0}.detailCover{display:block;max-height:250px;max-width:100%;margin:12px auto;object-fit:contain}.detailRows{display:grid;grid-template-columns:110px 1fr;gap:8px;border-top:1px solid #445672;padding-top:10px;overflow-wrap:anywhere}.detailRows dt{color:#aebfd7}.detailRows dd{margin:0;white-space:pre-wrap}.pager{display:flex;justify-content:center;align-items:center;gap:12px;margin:20px 0}@media(max-width:520px){.grid[data-view="three"]{gap:6px}.grid[data-view="three"] .cover{height:92px}.grid[data-view="three"] .cardbody{padding:7px}.grid[data-view="three"] .card h2{font-size:.78rem}.grid[data-view="three"] .meta,.grid[data-view="three"] .badges{display:none}.grid[data-view="two"] .cover{height:135px}}
</style></head><body><header><h1>🎮 ゲーム管理帳</h1><p class="sub">コレクションを、自分の手で記録する。</p></header><main><div class="toolbar"><strong id="summary">0 本</strong><div class="actions"><button id="exportBtn">JSONを書き出す</button><button id="importBtn">JSONを読み込む</button><input hidden type="file" id="importFile" accept="application/json,.json"><button class="primary" id="addBtn">＋ ゲームを登録</button></div></div><div class="filters"><input id="search" aria-label="検索" placeholder="タイトル・メーカー・タグ・メモを検索"><select id="platformFilter" aria-label="機種"><option value="">すべての機種</option></select><select id="ownedFilter" aria-label="所持"><option value="">所持状態すべて</option><option value="owned">所持</option><option value="wanted">欲しい</option><option value="former">手放した</option></select><select id="playFilter" aria-label="プレイ状況"><option value="">プレイ状況すべて</option><option value="unplayed">未プレイ</option><option value="playing">プレイ中</option><option value="cleared">クリア済み</option></select><select id="sort" aria-label="並び順"><option value="createdDesc">登録日・新しい順</option><option value="titleAsc">タイトル順</option><option value="releaseDesc">発売日・新しい順</option><option value="releaseAsc">発売日・古い順</option><option value="retailDesc">定価・高い順</option><option value="purchaseDesc">購入価格・高い順</option></select><select id="viewMode" aria-label="一覧の表示形式"><option value="two">写真付き・2列</option><option value="three">写真付き・3列</option><option value="list">タイトルのみ</option></select><select id="pageSize" aria-label="1ページの表示数"><option value="20">20件表示</option><option value="50">50件表示</option><option value="100">100件表示</option><option value="all">すべて表示</option></select></div><div id="count" class="count"></div><div id="grid" class="grid"></div><div id="pager" class="pager" hidden><button id="prevPage">前へ</button><span id="pageInfo"></span><button id="nextPage">次へ</button></div></main>
<dialog id="editor"><form id="form" class="modal"><div class="modalhead"><h2 id="dialogTitle">ゲームを登録</h2><button type="button" id="closeBtn" aria-label="閉じる">×</button></div><p class="hint">JANを入力すると駿河屋で検索できます。商品情報はページを見て手入力してください。</p><div class="section"><h3>商品情報</h3><div class="fields"><label class="wide">JAN<input name="jan" id="jan" inputmode="numeric" pattern="[0-9]*" placeholder="例：4995857080267"></label><div class="wide actions"><button type="button" id="scanBtn">📷 バーコードを読む</button><button type="button" id="surugayaBtn">駿河屋でJAN検索 ↗</button></div><p id="scanStatus" class="hint wide" aria-live="polite"></p><video id="camera" class="wide" playsinline muted hidden style="width:100%;max-height:260px"></video><button type="button" id="stopScan" hidden>カメラを閉じる</button><label class="wide">タイトル *<input name="title" required placeholder="お掃除戦隊くりーんきーぱー [通常版]"></label><label>機種<input name="platform" list="platforms" placeholder="Wii"><datalist id="platforms"><option value="Wii"><option value="DS"><option value="3DS"><option value="GBA"><option value="Switch"><option value="PS2"><option value="PSP"></datalist></label><label>メーカー・販売元<input name="publisher"></label><label>発売日<input name="releaseDate" type="date"></label><label>定価（円）<input name="retailPrice" type="number" min="0"></label><label>品番<input name="model"></label><label>ジャンル<input name="genre"></label><label>CERO<input name="cero" placeholder="A / B / C など"></label><div class="wide"><div>プレイ人数：<strong id="playerSummary">未設定</strong></div><div class="rangeRow"><label>最少 <output id="minOutput">1人</output><input id="minPlayers" type="range" min="1" max="12" value="1"></label><label>最大 <output id="maxOutput">1人</output><input id="maxPlayers" type="range" min="1" max="12" value="1"></label></div><button type="button" id="clearPlayers" class="small">人数指定を解除</button></div><label class="wide">画像URL<input name="imageUrl" type="url" placeholder="https://..."></label><label class="wide">画像ファイル（端末内に保存）<input id="imageFile" type="file" accept="image/*"></label><img id="imagePreview" class="preview" hidden alt="画像プレビュー"></div></div><div class="section"><h3>自分の記録</h3><div class="fields"><label>所持状態<select name="ownership"><option value="owned">所持</option><option value="wanted">欲しい</option><option value="former">手放した</option></select></label><label>プレイ状況<select name="playStatus"><option value="unplayed">未プレイ</option><option value="playing">プレイ中</option><option value="cleared">クリア済み</option></select></label><label>購入価格（円）<input name="purchasePrice" type="number" min="0"></label><label>購入場所<input name="purchasePlace"></label><label>購入日<input name="purchaseDate" type="date"></label><div class="wide"><div class="actions"><strong>タグ</strong><button type="button" id="manageTags" class="small">タグを編集・追加</button></div><div id="tagChoices" class="chipset"></div></div><label class="wide">メモ<textarea name="memo"></textarea></label></div><div class="checks"><label><input type="checkbox" name="box">箱あり</label><label><input type="checkbox" name="manual">説明書あり</label><label><input type="checkbox" name="favorite">お気に入り</label></div></div><p id="notice" class="notice" role="status"></p><div class="modalfoot"><button type="button" id="cancelBtn">キャンセル</button><button class="primary" type="submit">保存する</button></div></form></dialog><dialog id="detail"><div class="modal"><div class="modalhead"><h2 id="detailTitle"></h2><button id="detailClose" type="button" aria-label="閉じる">×</button></div><div id="detailBody"></div><div class="modalfoot"><button id="detailEdit" class="primary" type="button">編集</button></div></div></dialog><dialog id="tagDialog"><div class="modal"><div class="modalhead"><h2>タグを編集・追加</h2><button id="tagClose" type="button" aria-label="閉じる">×</button></div><p class="hint">ここで追加したタグは次回の登録でも選べます。使わないタグは一覧から削除できます。</p><div class="actions"><input id="newTag" aria-label="新しいタグ名" placeholder="新しいタグ"><button type="button" id="addTag" class="primary">追加</button></div><p id="tagError" class="notice" role="status"></p><div id="tagManager" class="chipset"></div></div></dialog><script>
'use strict';
const KEY='game-collection-v1', TAG_KEY='game-collection-tags-v1', PREF_KEY='game-collection-view-v1';
const DEFAULT_TAGS=['アクション','アドベンチャー','RPG','シミュレーション','パズル','シューティング','レース','スポーツ','音楽','ホラー','レトロ'];
const $=s=>document.querySelector(s);
const names=['jan','title','platform','publisher','releaseDate','retailPrice','model','genre','cero','imageUrl','ownership','playStatus','purchasePrice','purchasePlace','purchaseDate','memo'];
const ownership={owned:'所持',wanted:'欲しい',former:'手放した'}, play={unplayed:'未プレイ',playing:'プレイ中',cleared:'クリア済み'};
let games=[],tags=[...DEFAULT_TAGS],editing=null,imageData='',stream=null,scanTimer=null,selectedTags=new Set(),playersSet=false,page=1,detailId=null;
const make=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e};
const yen=v=>v!==''&&v!=null?Number(v).toLocaleString('ja-JP')+'円':'';
const splitTags=v=>Array.isArray(v)?v:(v||'').split(',').map(x=>x.trim()).filter(Boolean);
function load(){try{const a=JSON.parse(localStorage.getItem(KEY)||'[]');games=Array.isArray(a)?a:[]}catch{games=[]}try{const a=JSON.parse(localStorage.getItem(TAG_KEY)||'null');if(Array.isArray(a))tags=a.filter(x=>typeof x==='string')}catch{}try{const p=JSON.parse(localStorage.getItem(PREF_KEY)||'{}');if(['two','three','list'].includes(p.view))$('#viewMode').value=p.view;if(['20','50','100','all'].includes(p.size))$('#pageSize').value=p.size}catch{}}
function saveGames(){localStorage.setItem(KEY,JSON.stringify(games))}
function saveTags(){localStorage.setItem(TAG_KEY,JSON.stringify(tags))}
function savePrefs(){try{localStorage.setItem(PREF_KEY,JSON.stringify({view:$('#viewMode').value,size:$('#pageSize').value}))}catch{}}
function cover(g){const box=make('div','cover');const src=g.imageData||g.imageUrl;if(src){const img=make('img');img.alt='';img.src=src;img.onerror=()=>box.replaceChildren(document.createTextNode('🎮'));box.append(img)}else box.textContent='🎮';return box}
function render(){const pf=$('#platformFilter'),before=pf.value,platforms=[...new Set(games.map(g=>g.platform).filter(Boolean))].sort();pf.replaceChildren(new Option('すべての機種',''),...platforms.map(x=>new Option(x,x)));pf.value=platforms.includes(before)?before:'';
 const query=$('#search').value.trim().toLocaleLowerCase();let list=games.filter(g=>(!query||[g.title,g.platform,g.publisher,g.genre,g.model,g.jan,splitTags(g.tags).join(' '),g.memo].join(' ').toLocaleLowerCase().includes(query))&&(!pf.value||g.platform===pf.value)&&(!$('#ownedFilter').value||g.ownership===$('#ownedFilter').value)&&(!$('#playFilter').value||g.playStatus===$('#playFilter').value));
 const sort=$('#sort').value;list.sort((a,b)=>sort==='titleAsc'?(a.title||'').localeCompare(b.title||'','ja'):sort==='releaseDesc'?(b.releaseDate||'').localeCompare(a.releaseDate||''):sort==='releaseAsc'?(a.releaseDate||'').localeCompare(b.releaseDate||''):sort==='retailDesc'?Number(b.retailPrice||0)-Number(a.retailPrice||0):sort==='purchaseDesc'?Number(b.purchasePrice||0)-Number(a.purchasePrice||0):(b.createdAt||'').localeCompare(a.createdAt||''));
 const size=$('#pageSize').value==='all'?Infinity:Number($('#pageSize').value),pages=Math.max(1,Math.ceil(list.length/size));page=Math.min(page,pages);$('#summary').textContent=games.length+' 本';$('#count').textContent=list.length+' 件中 '+(list.length?((page-1)*size+1):0)+'〜'+Math.min(page*size,list.length)+' 件を表示';const grid=$('#grid');grid.dataset.view=$('#viewMode').value;grid.replaceChildren();
 if(!list.length)grid.append(make('div','empty',games.length?'条件に合うゲームがありません。':'まだゲームがありません。「＋ ゲームを登録」から始めましょう。'));
 for(const g of list.slice((page-1)*size,page*size)){const card=make('article','card'),open=make('button','cardOpen');open.type='button';open.setAttribute('aria-label',(g.title||'ゲーム')+'の詳細を開く');open.onclick=()=>showDetail(g.id);open.append(cover(g));const body=make('div','cardbody');body.append(make('h2','',g.title));body.append(make('p','meta',[g.platform,g.releaseDate].filter(Boolean).join(' · ')||'機種・発売日 未入力'));if(g.publisher)body.append(make('p','meta',g.publisher));if(g.retailPrice!=='')body.append(make('p','meta','定価 '+yen(g.retailPrice)));const badges=make('div','badges');for(const v of [ownership[g.ownership],play[g.playStatus],...splitTags(g.tags)])if(v)badges.append(make('span','badge',v));body.append(badges);open.append(body);card.append(open);grid.append(card)}
 $('#pager').hidden=pages<=1;$('#pageInfo').textContent=page+' / '+pages;$('#prevPage').disabled=page<=1;$('#nextPage').disabled=page>=pages;
}
function showDetail(id){const g=games.find(x=>x.id===id);if(!g)return;detailId=id;$('#detailTitle').textContent=g.title;const body=$('#detailBody');body.replaceChildren();if(g.imageData||g.imageUrl){const img=make('img','detailCover');img.src=g.imageData||g.imageUrl;img.alt=g.title+' の画像';body.append(img)}const rows=make('dl','detailRows');const entries=[['機種',g.platform],['メーカー・販売元',g.publisher],['発売日',g.releaseDate],['定価',yen(g.retailPrice)],['品番',g.model],['JAN',g.jan],['ジャンル',g.genre],['CERO',g.cero],['プレイ人数',g.players],['所持状態',ownership[g.ownership]],['プレイ状況',play[g.playStatus]],['購入価格',yen(g.purchasePrice)],['購入場所',g.purchasePlace],['購入日',g.purchaseDate],['タグ',splitTags(g.tags).join('、')],['箱',g.box?'あり':'なし'],['説明書',g.manual?'あり':'なし'],['お気に入り',g.favorite?'はい':'いいえ'],['メモ',g.memo]];for(const [key,value] of entries){rows.append(make('dt','',key),make('dd','',value||'—'))}body.append(rows);$('#detail').showModal()}
function renderTags(){const all=[...new Set([...tags,...selectedTags])],host=$('#tagChoices');host.replaceChildren();for(const t of all){const b=make('button','chip',t);b.type='button';b.setAttribute('aria-pressed',String(selectedTags.has(t)));b.onclick=()=>{selectedTags.has(t)?selectedTags.delete(t):selectedTags.add(t);renderTags()};host.append(b)}}
function renderTagManager(){const host=$('#tagManager');host.replaceChildren();for(const t of tags){const item=make('span','badge',t+' '),del=make('button','small','×');del.type='button';del.setAttribute('aria-label',t+'を候補から削除');del.onclick=()=>{tags=tags.filter(x=>x!==t);try{saveTags();renderTagManager();renderTags()}catch{tags.push(t);$('#tagError').textContent='タグを保存できませんでした'}};item.append(del);host.append(item)}}
function setPlayers(min,max){playersSet=!!min;if(!playersSet){min=1;max=1}$('#minPlayers').value=Math.min(12,Math.max(1,min));$('#maxPlayers').value=Math.min(12,Math.max(Number($('#minPlayers').value),max));updatePlayers()}
function updatePlayers(changed){let a=Number($('#minPlayers').value),b=Number($('#maxPlayers').value);if(a>b){if(changed==='min')$('#maxPlayers').value=a;else $('#minPlayers').value=b}a=Number($('#minPlayers').value);b=Number($('#maxPlayers').value);$('#minOutput').textContent=a+'人';$('#maxOutput').textContent=b+'人';$('#playerSummary').textContent=playersSet?(a===b?a+'人専用':a+'〜'+b+'人'):'未設定'}
function openEditor(g=null){stopScan();editing=g?.id||null;$('#form').reset();$('#notice').textContent='';$('#scanStatus').textContent='';$('#dialogTitle').textContent=g?'ゲームを編集':'ゲームを登録';imageData=g?.imageData||'';for(const name of names)if(g&&g[name]!=null)$('#form').elements[name].value=g[name];for(const name of ['box','manual','favorite'])$('#form').elements[name].checked=!!g?.[name];selectedTags=new Set(splitTags(g?.tags));const m=(g?.players||'').match(/^(\d+)(?:\s*[〜～-]\s*(\d+))?\s*人?(?:専用)?$/);setPlayers(m?Number(m[1]):null,m?Number(m[2]||m[1]):null);renderTags();preview();$('#editor').showModal()}
function preview(){const img=$('#imagePreview');img.src=imageData||$('#form').elements.imageUrl.value||'';img.hidden=!img.src}
function stopScan(){if(scanTimer)clearInterval(scanTimer);scanTimer=null;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('#camera').hidden=true;$('#stopScan').hidden=true}
async function scan(){if(!('BarcodeDetector' in window)){$('#scanStatus').textContent='このブラウザは自動読み取りに対応していません。JAN欄に数字を入力してください。';return}try{const detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a']});stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const video=$('#camera');video.srcObject=stream;video.hidden=false;$('#stopScan').hidden=false;await video.play();$('#scanStatus').textContent='バーコードをカメラに映してください。';let busy=false;scanTimer=setInterval(async()=>{if(busy)return;busy=true;try{const a=await detector.detect(video);if(a.length){$('#jan').value=a[0].rawValue;$('#scanStatus').textContent='JANを読み取りました。';stopScan()}}catch{}finally{busy=false}},250)}catch{stopScan();$('#scanStatus').textContent='カメラを使えませんでした。JANを手入力してください。'}}
$('#form').onsubmit=e=>{e.preventDefault();const f=e.currentTarget,g={id:editing||(typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'game-'+Date.now()+'-'+Math.random().toString(36).slice(2)),createdAt:editing?(games.find(x=>x.id===editing)?.createdAt||new Date().toISOString()):new Date().toISOString()};for(const name of names)g[name]=f.elements[name].value.trim();g.players=playersSet?(Number($('#minPlayers').value)===Number($('#maxPlayers').value)?$('#minPlayers').value+'人専用':$('#minPlayers').value+'〜'+$('#maxPlayers').value+'人'):'';g.tags=[...selectedTags].join(', ');for(const name of ['box','manual','favorite'])g[name]=f.elements[name].checked;g.imageData=imageData;if(g.jan&&!/^(\d{8}|\d{13})$/.test(g.jan)){$('#notice').textContent='JANは8桁または13桁の数字で入力してください。';return}const old=games;games=editing?games.map(x=>x.id===editing?g:x):[g,...games];try{saveGames();stopScan();$('#editor').close();page=1;render();showDetail(g.id)}catch{games=old;$('#notice').textContent='保存できませんでした。空き容量を確認してください。'}};
$('#imageFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const url=URL.createObjectURL(file),img=new Image();try{await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});const canvas=document.createElement('canvas'),scale=Math.min(1,700/Math.max(img.naturalWidth,img.naturalHeight));canvas.width=Math.round(img.naturalWidth*scale);canvas.height=Math.round(img.naturalHeight*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);imageData=canvas.toDataURL('image/jpeg',.72);preview()}finally{URL.revokeObjectURL(url)}}catch{$('#notice').textContent='画像を読み込めませんでした。'}};
